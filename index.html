<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KE school | Центр онлайн-диагностики</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --border-color: #1e293b;
            --border-hover: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-orange: #f97316;
            --accent-orange-hover: #ea580c;
            --primary-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 60px 20px;
        }

        /* Header / Navigation */
        nav {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Точный встроенный SVG логотипа-солнышка */
        .logo-sun {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
        }

        .logo-text-ke {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-text-school {
            color: var(--accent-orange);
            font-weight: 800;
            margin-left: 6px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-btn:hover {
            border-color: var(--text-muted);
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* Hero Section */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 16px;
            color: #fff;
            font-weight: 800;
        }

        header h1 span {
            color: var(--primary-blue);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 750px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.75rem;
            margin-bottom: 24px;
            color: #fff;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background: var(--accent-orange);
            border-radius: 3px;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 50px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .grade-btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .grade-btn:hover {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
            width: 100%;
            max-width: 1100px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

<a href="#" class="logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 24px; font-weight: 700; color: #ff7b00; margin-top: 35px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #ff7b00;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
    KE<span style="color: #ffffff;">school</span>
</a>
</a>
            </div>
        </a>
            </nav>

<div class="container">
    <header>
        <h1>Центр <span>онлайн-диагностики</span> знаний</h1>
        <p>Выберите предмет и класс, чтобы пройти интерактивный тест, выявить скрытые пробелы в логике и формулах, а также получить персональный план обучения.</p>
    </header>

    <section>
        <h2 class="section-title">Математика (1–9 классы)</h2>
        <div class="grid" id="math-grid"></div>
    </section>

    <section>
        <h2 class="section-title">Физика (7–9 классы)</h2>
        <div class="grid" id="physics-grid"></div>
    </section>
</div>

<footer>
    &copy; 2026 KE school. Все права защищены.
</footer>

<script>
    const mathGrid = document.getElementById('math-grid');
    const mathBlocks = [
        { title: "Младшая школа (1–3 кл)", desc: "Базовые вычислительные навыки, таблица умножения, простые уравнения и логика.", start: 1, end: 3 },
        { title: "Средняя школа (4–6 кл)", desc: "Дроби, проценты, отрицательные числа, первые текстовые задачи на движение и работу.", start: 4, end: 6 },
        { title: "Старший блок (7–9 кл)", desc: "Алгебра, геометрия, функции, уравнения и подготовка к базовой логике экзаменов.", start: 7, end: 9 }
    ];

    mathBlocks.forEach(block => {
        let buttonsHtml = '';
        for (let i = block.start; i <= block.end; i++) {
            buttonsHtml += `<a href="math-${i}.html" class="grade-btn">${i} кл</a>`;
        }
        mathGrid.innerHTML += `
            <div class="card">
                <div>
                    <h3>${block.title}</h3>
                    <p>${block.desc}</p>
                </div>
                <div class="grades-grid">
                    ${buttonsHtml}
                </div>
            </div>
        `;
    });

    const physicsGrid = document.getElementById('physics-grid');
    physicsGrid.innerHTML += `
        <div class="card" style="grid-column: 1 / -1; max-width: 600px;">
            <div>
                <h3>Курс физики (7–9 классы)</h3>
                <p>Тепловые, электрические, световые и механические явления. Интерактивные симуляции, расчетные задачи и проверка физического мышления.</p>
            </div>
            <div class="grades-grid" style="grid-template-columns: repeat(3, 1fr); max-width: 300px;">
                <a href="physics-7.html" class="grade-btn">7 кл</a>
                <a href="physics-8.html" class="grade-btn">8 кл</a>
                <a href="physics-9.html" class="grade-btn">9 кл</a>
            </div>
        </div>
    `;
</script>

</body>
</html>
